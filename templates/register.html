{% extends "base.html" %}
{% block title %}Create account · ATM Banking{% endblock %}
{% block content %}
<section class="center-layout">
    <div class="card auth-card register-card">
        <div class="card-heading"><p class="eyebrow">JOIN ATM BANKING</p><h2>Create account</h2><p>Your new account starts with a zero balance.</p></div>
        <form method="post" action="/register" class="form-stack">
            <label>Full name<input name="full_name" value="{{ full_name or '' }}" autocomplete="name" required></label>
            <label>Username<input name="username" value="{{ username or '' }}" autocomplete="username" required></label>
            <label>Phone number<input name="phone_number" value="{{ phone_number or '' }}" placeholder="Phone number" autocomplete="tel" required></label>
            <div class="two-columns">
                <label>4-digit PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label>
                <label>Confirm PIN<input name="confirm_pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label>
            </div>
            <button class="primary-button" type="submit">Open account <span>→</span></button>
        </form>
        <p class="form-footer">Already have an account? <a href="/login">Sign in</a></p>
    </div>
</section>
{% endblock %}
